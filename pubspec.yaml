name: naglec
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

# Залежності додатку
dependencies:
  media_kit: ^1.1.10
  media_kit_video: ^1.3.1
  media_kit_libs_video: ^1.0.7
  video_player: ^2.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  get_it: ^7.7.0
  path_provider: ^2.1.2    # Для доступу до пам'яті телефону
  screenshot: ^3.0.0       # Для створення прев'ю слота
  window_manager: ^0.4.3   # Розмір вікна на десктопі

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Усі папки з lib/assets (адреси кожной папки).
